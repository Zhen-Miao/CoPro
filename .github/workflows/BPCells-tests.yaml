on:
  push:
    branches: [main, master]
  schedule:
    - cron: "37 12 * * 0"
  workflow_dispatch:

name: BPCells-tests

permissions: read-all

jobs:
  BPCells-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            github::bnprks/BPCells/r
            local::.
          dependencies: '"hard"'
          needs: check

      - name: Verify BPCells installation
        run: stopifnot(requireNamespace("BPCells", quietly = TRUE))
        shell: Rscript {0}

      - name: Run full test suite
        run: testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}
